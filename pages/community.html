<!-- Farmer Community Views -->
<!-- Related route views are grouped here because their content is rendered by the application modules. -->

<section class="page-view" data-page="farmers" id="page-farmers">
  <div class="container page-heading">
    <span class="eyebrow">The people behind the produce</span>
    <h1>Meet your local farmers</h1>
    <p>
      Get to know the growers, their farms, and the methods that shape every
      harvest.
    </p>
  </div>
  <div class="container section-tight section-top-zero">
    <div class="section-head-row">
      <p class="result-count" id="farmer-result-count"></p>
      <a
        class="button button-soft button-small"
        data-route=""
        href="#/dashboard"
        >Open farmer dashboard</a
      >
    </div>
    <div class="farmers-grid" id="farmers-grid"></div>
  </div>
</section>

<!-- Farmer Profile page -->
<section class="page-view" data-page="farmer-profile" id="page-farmer-profile">
  <div class="container farmer-profile-wrap" id="farmer-profile-content">
    <noscript>
      <p>
        Farmer information is loaded dynamically. Please enable JavaScript to
        continue.
      </p>
    </noscript>
  </div>
</section>
